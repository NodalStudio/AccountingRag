# Keeps `main` history in Conventional Commits form without blocking anyone:
# - PRs are squash-merged with the PR title as the commit message, so the PR
#   title is checked (branch commits stay free-form — gitmoji welcome).
# - Direct pushes to main get their commit messages checked; a failure shows a
#   red ✗ on the commit but does not block the push.
# Plain shell, no third-party actions — nothing to go stale or need allowlisting.
# See CLAUDE.md § Git workflow.§ Git workflow.
name: Commit convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Job names stay short and stable: GitHub matches required status checks by
# the reported check-run name (the job's `name:`), and BRANCH_PROTECTION.md
# references them verbatim.
jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,-]+\))?!?: .+'
          if echo "$TITLE" | grep -qE "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit (type(scope): subject — e.g. feat(ledger): ...). See CLAUDE.md § Git workflow."
            exit 1
          fi

  main-commits:
    name: main-commits
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,-]+\))?!?: .+'
          # `before` is all-zeros on the first push, and unreachable after a
          # force-push; a bare rev-list would then fail silently inside the
          # loop's word list and the job would pass green over zero commits.
          zero='0000000000000000000000000000000000000000'
          if [ "$BEFORE" = "$zero" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::warning::Base commit unavailable (first push or force-push); checking the pushed head only."
            shas=$(git rev-list -1 "$AFTER")
          else
            shas=$(git rev-list "$BEFORE..$AFTER")
          fi
          status=0
          count=0
          for sha in $shas; do
            count=$((count + 1))
            msg=$(git log -1 --format=%s "$sha")
            if echo "$msg" | grep -qE "$pattern"; then
              echo "OK $sha: $msg"
            else
              echo "::error::Commit $sha \"$msg\" is not a Conventional Commit (type(scope): subject). See CLAUDE.md § Git workflow."
              status=1
            fi
          done
          echo "Checked $count commit(s)."
          if [ "$count" -eq 0 ]; then
            echo "::error::No commits examined — refusing to report a green check that verified nothing."
            exit 1
          fi
          exit $status
